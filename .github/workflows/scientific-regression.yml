name: Scientific regression

on:
  pull_request:
  push:
    branches:
      - main
      - phase-2-safety-net
      - "stabilize/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-python-312:
    name: macOS Python 3.12 portable and scientific regression
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The pipeline imports Tk modules without opening a GUI. A conda-forge
      # Python/Tk pair avoids depending on whichever Tcl/Tk the runner ships.
      - name: Set up CPython and Tk
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: heat-index-ci
          python-version: "3.12.13"
          channels: conda-forge
          channel-priority: strict

      - name: Install reference dependencies and check Tk
        run: |
          conda install -y tk
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements.txt -c constraints/windows-py312-reference.txt
          python -m pip check
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Prepare temporary plot directory
        run: |
          mkdir -p "$RUNNER_TEMP/matplotlib"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"

      - name: Run portable and scientific regressions
        run: >-
          python -m pytest -ra -p no:cacheprovider
          --basetemp "$RUNNER_TEMP/pytest"
          -m "not local_integration and not windows_dji"

  windows-python-312:
    name: Windows Python 3.12 portable and platform regression
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Install reference dependencies and check Tk
        shell: pwsh
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements.txt -c constraints/windows-py312-reference.txt
          python -m pip check
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Prepare temporary plot directory
        shell: pwsh
        run: |
          $mpl = Join-Path $env:RUNNER_TEMP "matplotlib"
          New-Item -ItemType Directory -Force -Path $mpl | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "MPLCONFIGDIR=$mpl"

      - name: Run portable, Windows, and scientific regressions
        shell: pwsh
        run: >-
          python -m pytest -ra -p no:cacheprovider
          --basetemp "$env:RUNNER_TEMP\pytest"
          -m "not local_integration and not windows_dji"
