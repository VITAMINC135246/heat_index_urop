name: Scientific regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-312:
    name: Windows Python 3.12 scientific and workflow regression
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}\matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Install accepted reference dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install -r requirements.txt -c constraints/windows-py312-reference.txt
          python -m pip check

      - name: Run tracked scientific and workflow regressions
        shell: pwsh
        run: >-
          python -m pytest -ra -p no:cacheprovider
          --basetemp "$env:RUNNER_TEMP\pytest"
          -m "not local_integration"
