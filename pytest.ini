[pytest]
addopts = --strict-markers
markers =
    unit: checks one small function or component in isolation
    integration: checks two or more components working together
    regression: protects previously correct software behavior
    scientific_regression: compares scientific data and results with an accepted reference
    windows_dji: requires the real Windows DJI SDK or TAT3 environment and local source data
    local_integration: requires ignored controlled-local assets without modifying them
